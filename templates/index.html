<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #0f1620;
      --text: #e6edf3;
      --muted: #8b949e;
      --ok: #2ea043;
      --bad: #f85149;
      --warn: #d29922;
      --line: #30363d;
    }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system; background: var(--bg); color: var(--text); }
    header { padding: 16px 18px; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    header .title { font-weight: 700; letter-spacing: 0.2px; }
    header .meta { color: var(--muted); font-size: 12px; }
    main { padding: 18px; display:grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .span-4 { grid-column: span 4; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .k { color: var(--muted); font-size: 12px; }
    .v { font-size: 18px; font-weight: 650; }
    .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border:1px solid var(--line); }
    .ok { color: var(--ok); border-color: rgba(46,160,67,.4); }
    .bad { color: var(--bad); border-color: rgba(248,81,73,.4); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; }
    .feed { max-height: 260px; overflow:auto; }
    .feed-item { padding: 10px 10px; border-bottom: 1px solid var(--line); }
    .feed-item:last-child { border-bottom: none; }
    .feed-item .t { color: var(--muted); font-size: 12px; }

    .tiles { display:grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
    .tile { background: rgba(255,255,255,0.02); border:1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 74px; }
    .tile .label { color: var(--muted); font-size: 12px; }
    .tile .value { font-size: 18px; font-weight: 650; margin-top: 6px; }
    .tile .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }

    @media (max-width: 880px) {
      .tiles { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">{{ title }}</div>
      <div class="meta">Local-first OpenClaw dashboard • SSE live updates</div>
      <div style="margin-top:8px">
        <select id="agentSelect" style="background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px">
          <option value="">All agents</option>
        </select>
      </div>
    </div>
    <div style="text-align:right">
      <div class="meta" id="host">—</div>
      <div class="meta" id="clock">—</div>
    </div>
  </header>

  <main>
    <section class="card span-12">
      <div class="k">Status</div>
      <div class="tiles" style="margin-top:10px">
        <div class="tile">
          <div class="label">Gateway</div>
          <div class="value" id="tGateway">—</div>
          <div class="sub mono" id="tGatewaySub">—</div>
        </div>
        <div class="tile">
          <div class="label">Cron</div>
          <div class="value" id="tCron">—</div>
          <div class="sub mono" id="tCronSub">—</div>
        </div>
        <div class="tile">
          <div class="label">Channels</div>
          <div class="value" id="tChannels">—</div>
          <div class="sub" id="tChannelsSub">—</div>
        </div>
        <div class="tile">
          <div class="label">Security audit</div>
          <div class="value" id="tSecurity">—</div>
          <div class="sub" id="tSecuritySub">—</div>
        </div>

        <div class="tile">
          <div class="label">Sessions</div>
          <div class="value" id="tSessions">—</div>
          <div class="sub" id="tSessionsSub">—</div>
        </div>
        <div class="tile">
          <div class="label">Link</div>
          <div class="value" id="tLink">—</div>
          <div class="sub" id="tLinkSub">—</div>
        </div>
        <div class="tile">
          <div class="label">Last restart/config apply</div>
          <div class="value" id="restartMsg">—</div>
          <div class="sub mono" id="restartMeta">—</div>
        </div>
        <div class="tile">
          <div class="label">OpenClaw</div>
          <div class="value" id="oc">—</div>
          <div class="sub mono" id="ocmeta">—</div>
          <div class="sub mono" id="cronmeta">—</div>
        </div>
      </div>
    </section>

    <section class="card span-12">
      <div class="k">Security audit</div>
      <div class="k" id="secSummary">—</div>
      <div class="feed" id="secFindings" style="max-height:220px"><div class="feed-item"><div class="t">Loading</div><div>Loading security findings…</div><div class="k mono"></div></div></div>
    </section>

    <section class="card span-12">
      <div class="k">Activity</div>
      <div class="feed" id="feed"><div class="feed-item"><div class="t">Loading</div><div>Loading activity…</div><div class="k mono"></div></div></div>
    </section>
  </main>

<script>
  const feed = document.getElementById('feed');
  const oc = document.getElementById('oc');
  const ocmeta = document.getElementById('ocmeta');
  const cronmeta = document.getElementById('cronmeta');
  const restartMsg = document.getElementById('restartMsg');
  const restartMeta = document.getElementById('restartMeta');
  const host = document.getElementById('host');
  const agentSelect = document.getElementById('agentSelect');
  const secSummary = document.getElementById('secSummary');
  const secFindings = document.getElementById('secFindings');

  let selectedAgent = localStorage.getItem('clawboard.agent') || '';

  const tGateway = document.getElementById('tGateway');
  const tGatewaySub = document.getElementById('tGatewaySub');
  const tCron = document.getElementById('tCron');
  const tCronSub = document.getElementById('tCronSub');
  const tChannels = document.getElementById('tChannels');
  const tChannelsSub = document.getElementById('tChannelsSub');
  const tSecurity = document.getElementById('tSecurity');
  const tSecuritySub = document.getElementById('tSecuritySub');
  const tSessions = document.getElementById('tSessions');
  const tSessionsSub = document.getElementById('tSessionsSub');
  const tLink = document.getElementById('tLink');
  const tLinkSub = document.getElementById('tLinkSub');

  const fmtTime = (ts) => {
    try { return new Date(ts*1000).toLocaleString(); } catch { return String(ts); }
  }

  function shouldShowEvent(evt) {
    if (!selectedAgent) return true;
    if (!evt || !evt.type) return true;
    // Only filter session events for now.
    if (evt.type === 'session') {
      return (evt.session?.agentId || '') === selectedAgent;
    }
    return true;
  }

  function renderEvent(evt, initial=false) {
    if (!shouldShowEvent(evt)) return;
    const kind = evt.type || "event";
    let text = "";
    let meta = "";

    if (kind === "cron_run") {
      text = `${evt.jobName || evt.jobId} → ${evt.status || "unknown"}`;
      meta = evt.summary || "";
    } else if (kind === "restart") {
      text = evt.payload?.payload?.message || evt.payload?.message || "restart/config";
      meta = JSON.stringify(evt.payload?.payload?.stats || evt.payload?.stats || {});
    } else if (kind === "link") {
      text = evt.linked ? "Link channel connected" : "Link channel disconnected";
    } else if (kind === "repo_commit") {
      text = `${evt.repo} ${evt.sha}`;
      meta = `${evt.message || ""} (${evt.author || ""})`;
    } else if (kind === "session") {
      const s = evt.session || {};
      text = `Session updated: ${s.key || "?"}`;
      meta = `model=${s.model || "?"} tokens=${s.totalTokens ?? "?"}`;
    } else if (kind === "telegram_send") {
      text = `Telegram send → ${evt.target || "?"}`;
      meta = `voice=${evt.asVoice ? 'yes' : 'no'} media=${evt.hasPath ? (evt.filename || 'yes') : 'no'}`;
    } else if (kind === "telegram_inbound") {
      text = `Telegram inbound ← ${evt.peerId || "?"}`;
      meta = '';
    } else {
      text = JSON.stringify(evt).slice(0, 180);
    }

    const ts = (initial && evt.ts) ? evt.ts : (Date.now()/1000);
    addFeed(kind, text, meta, ts, initial);
  }

  function addFeed(kind, text, meta, ts, initial=false) {
    const el = document.createElement('div');
    el.className = 'feed-item';
    el.innerHTML = `
      <div class="t">${fmtTime(ts)} • ${kind}</div>
      <div>${text}</div>
      <div class="k mono">${meta || ''}</div>
    `;
    if (initial) {
      feed.append(el);
    } else {
      feed.prepend(el);
    }
  }

  function renderAgentSelect(s) {
    if (!agentSelect) return;
    const agents = (s.openclaw_status?.agents?.agents || []).map(a => a.id).filter(Boolean);

    // If selected agent no longer exists, reset.
    if (selectedAgent && !agents.includes(selectedAgent)) {
      selectedAgent = '';
      localStorage.removeItem('clawboard.agent');
    }

    const existing = new Set(Array.from(agentSelect.options).map(o => o.value));
    for (const id of agents) {
      if (existing.has(id)) continue;
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = id;
      agentSelect.appendChild(opt);
    }

    agentSelect.value = selectedAgent;
  }

  function attachAgentSelectHandlers() {
    if (!agentSelect) return;
    agentSelect.addEventListener('change', async () => {
      selectedAgent = agentSelect.value || '';
      if (selectedAgent) localStorage.setItem('clawboard.agent', selectedAgent);
      else localStorage.removeItem('clawboard.agent');
      // Re-render from server caches
      await refreshAll();
    });
  }

  async function boot() {
    attachAgentSelectHandlers();

    const s = await fetch('/api/status').then(r=>r.json());
    renderAgentSelect(s);
    renderStatus(s);

    const a = await fetch('/api/activity').then(r=>r.json());
    feed.innerHTML = '';
    (a.events || []).forEach(evt => renderEvent(evt, true));

    const es = new EventSource('/api/events');
    es.addEventListener('link', async (e) => {
      const d = JSON.parse(e.data);
      renderEvent(d);
      await refreshStatusOnly();
    });
    es.addEventListener('cron_run', async (e) => {
      const d = JSON.parse(e.data);
      renderEvent(d);
      await refreshStatusOnly();
    });
    
    es.addEventListener('restart', async (e) => {
      const d = JSON.parse(e.data);
      renderEvent(d);
      await refreshStatusOnly();
    });

    es.addEventListener('telegram_send', (e) => {
      const d = JSON.parse(e.data);
      renderEvent(d);
    });
    es.addEventListener('telegram_inbound', (e) => {
      const d = JSON.parse(e.data);
      renderEvent(d);
    });
  }

  async function refreshStatusOnly() {
    const s = await fetch('/api/status').then(r=>r.json());
    renderAgentSelect(s);
    renderStatus(s);
  }

  async function refreshAll() {
    await refreshStatusOnly();
    const a = await fetch('/api/activity').then(r=>r.json());
    feed.innerHTML = '';
    (a.events || []).forEach(evt => renderEvent(evt, true));
  }

  function fmtBytes(n) {
    if (n === null || n === undefined) return '—';
    const units = ['B','KB','MB','GB','TB'];
    let x = n;
    let i = 0;
    while (x >= 1024 && i < units.length-1) { x /= 1024; i++; }
    return `${x.toFixed(i===0?0:1)}${units[i]}`;
  }

  function renderHost(s) {
    if (!host) return;
    const cpu = (s.host_cpu_pct === null || s.host_cpu_pct === undefined) ? '—' : `${s.host_cpu_pct.toFixed(0)}%`;
    const mem = (s.host_mem_used_bytes && s.host_mem_total_bytes) ? `${fmtBytes(s.host_mem_used_bytes)} / ${fmtBytes(s.host_mem_total_bytes)}` : '—';
    const load = (s.host_load1 === null || s.host_load1 === undefined) ? '—' : s.host_load1.toFixed(2);
    host.textContent = `host: cpu ${cpu} • mem ${mem} • load1 ${load}`;
  }

  function clearNode(n) {
    if (!n) return;
    while (n.firstChild) n.removeChild(n.firstChild);
  }

  function addFindingRow(kind, text, meta) {
    if (!secFindings) return;
    const el = document.createElement('div');
    el.className = 'feed-item';
    el.innerHTML = `
      <div class="t">${kind}</div>
      <div>${text}</div>
      <div class="k mono">${meta || ''}</div>
    `;
    secFindings.appendChild(el);
  }

  function renderSecurityAudit(ocStatus) {
    const summary = ocStatus?.securityAudit?.summary || {};
    const findings = ocStatus?.securityAudit?.findings || [];
    const crit = summary.critical ?? 0;
    const warn = summary.warn ?? 0;
    const info = summary.info ?? 0;

    if (secSummary) {
      secSummary.textContent = `critical=${crit} • warn=${warn} • info=${info}`;
    }

    if (!secFindings) return;
    clearNode(secFindings);

    if (!findings.length) {
      addFindingRow('clean', 'No security audit findings', '');
      return;
    }

    for (const f of findings) {
      const sev = (f.severity || 'info').toUpperCase();
      const title = f.title || f.checkId || 'finding';
      const detail = (f.detail || '').toString().slice(0, 300);
      const remediation = (f.remediation || '').toString().slice(0, 240);
      const meta = [detail, remediation ? `fix: ${remediation}` : ''].filter(Boolean).join(' • ');
      addFindingRow(sev, title, meta);
    }
  }

  function renderStatus(s) {
    renderHost(s);

    const ocStatus = s.openclaw_status || {};

    // OpenClaw tile
    if (s.openclaw_ok) {
      oc.innerHTML = `<span class="pill ok">OK</span>`;
      ocmeta.textContent = `sessions=${ocStatus?.sessions?.count ?? '?'} • model=${ocStatus?.sessions?.defaults?.model ?? '?'}`;
    } else {
      oc.innerHTML = `<span class="pill bad">ERR</span>`;
      ocmeta.textContent = s.openclaw_error || 'openclaw status failed';
    }

    // Gateway tile
    const gwOk = ocStatus?.gateway?.reachable;
    tGateway.innerHTML = gwOk ? `<span class="pill ok">OK</span>` : `<span class="pill bad">ERR</span>`;
    const gwUrl = ocStatus?.gateway?.url || '—';
    const gwVer = ocStatus?.gateway?.self?.version || 'unknown';
    tGatewaySub.textContent = `${gwVer} • ${gwUrl}`;

    // Cron tile
    if (s.cron_enabled === null || s.cron_enabled === undefined) {
      tCron.textContent = '—';
      tCronSub.textContent = '';
      cronmeta.textContent = '';
    } else {
      tCron.textContent = s.cron_enabled ? 'on' : 'off';
      tCronSub.textContent = `jobs=${s.cron_jobs ?? '?'} • nextWakeAtMs=${s.cron_next_wake_at_ms ?? '?'}`;
      cronmeta.textContent = `cron: ${s.cron_enabled ? 'on' : 'off'} • jobs=${s.cron_jobs ?? '?'} • nextWakeAtMs=${s.cron_next_wake_at_ms ?? '?'}`;
    }

    // Channels tile (summary line is already metadata-only)
    const cs = ocStatus?.channelSummary || [];
    tChannels.textContent = `${cs.length || 0}`;
    tChannelsSub.textContent = (cs || []).slice(0, 3).join(' · ');

    // Security audit tile + panel
    const sa = ocStatus?.securityAudit?.summary || {};
    const warn = sa.warn ?? 0;
    const crit = sa.critical ?? 0;
    tSecurity.textContent = (crit > 0) ? `critical ${crit}` : (warn > 0 ? `warn ${warn}` : 'clean');
    tSecuritySub.textContent = (crit > 0) ? 'needs attention' : (warn > 0 ? 'review recommended' : 'no findings');
    renderSecurityAudit(ocStatus);

    // Sessions tile
    const byAgent = ocStatus?.sessions?.byAgent || [];
    const allRecent = ocStatus?.sessions?.recent || [];

    let count = ocStatus?.sessions?.count ?? allRecent.length ?? 0;
    let recent = allRecent;
    if (selectedAgent) {
      const a = byAgent.find(x => x.agentId === selectedAgent);
      if (a) {
        count = a.count ?? 0;
        recent = a.recent || [];
      } else {
        count = 0;
        recent = [];
      }
    }

    tSessions.textContent = `${count}`;
    const topModel = recent?.[0]?.model;
    tSessionsSub.textContent = selectedAgent ? `agent=${selectedAgent}${topModel ? ` • latest model=${topModel}` : ''}` : (topModel ? `latest model=${topModel}` : '');

    // Link tile
    const lc = ocStatus?.linkChannel;
    if (lc && lc.linked !== undefined) {
      tLink.textContent = lc.linked ? 'connected' : 'disconnected';
      tLinkSub.textContent = `${lc.label || lc.id || ''}`;
    } else {
      tLink.textContent = '—';
      tLinkSub.textContent = '';
    }

    // Restart tile
    if (s.last_restart && s.last_restart.payload) {
      restartMsg.textContent = s.last_restart.payload.message || '(no message)';
      restartMeta.textContent = JSON.stringify(s.last_restart.payload.stats || {});
    } else {
      restartMsg.textContent = '—';
      restartMeta.textContent = '—';
    }
  }

  setInterval(()=>{
    document.getElementById('clock').textContent = new Date().toLocaleString();
  }, 1000);

  boot();
</script>
</body>
</html>
