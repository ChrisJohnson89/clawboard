<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #0f1620;
      --text: #e6edf3;
      --muted: #8b949e;
      --ok: #2ea043;
      --bad: #f85149;
      --warn: #d29922;
      --line: #30363d;
    }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system; background: var(--bg); color: var(--text); }
    header { padding: 16px 18px; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    header .title { font-weight: 700; letter-spacing: 0.2px; }
    header .meta { color: var(--muted); font-size: 12px; }
    main { padding: 18px; display:grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .span-4 { grid-column: span 4; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .k { color: var(--muted); font-size: 12px; }
    .v { font-size: 18px; font-weight: 650; }
    .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border:1px solid var(--line); }
    .ok { color: var(--ok); border-color: rgba(46,160,67,.4); }
    .bad { color: var(--bad); border-color: rgba(248,81,73,.4); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; }
    .feed { max-height: 260px; overflow:auto; }
    .feed-item { padding: 10px 10px; border-bottom: 1px solid var(--line); }
    .feed-item:last-child { border-bottom: none; }
    .feed-item .t { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">{{ title }}</div>
      <div class="meta">Local-first OpenClaw dashboard • SSE live updates</div>
    </div>
    <div class="meta" id="clock">—</div>
  </header>

  <main>
    <section class="card span-4">
      <div class="k">OpenClaw</div>
      <div class="v" id="oc">—</div>
      <div class="k mono" id="ocmeta">—</div>
      <div class="k mono" id="cronmeta">—</div>
    </section>

    <section class="card span-8">
      <div class="k">Last restart/config apply</div>
      <div class="v" id="restartMsg">—</div>
      <div class="k mono" id="restartMeta">—</div>
    </section>

    <section class="card span-12">
      <div class="k">Activity</div>
      <div class="feed" id="feed"></div>
    </section>
  </main>

<script>
  const feed = document.getElementById('feed');
  const oc = document.getElementById('oc');
  const ocmeta = document.getElementById('ocmeta');
  const cronmeta = document.getElementById('cronmeta');
  const restartMsg = document.getElementById('restartMsg');
  const restartMeta = document.getElementById('restartMeta');

  const fmtTime = (ts) => {
    try { return new Date(ts*1000).toLocaleString(); } catch { return String(ts); }
  }

  function renderEvent(evt, initial=false) {
    const kind = evt.type || "event";
    let text = "";
    let meta = "";

    if (kind === "cron_run") {
      text = `${evt.jobName || evt.jobId} → ${evt.status || "unknown"}`;
      meta = evt.summary || "";
    } else if (kind === "restart") {
      text = evt.payload?.payload?.message || evt.payload?.message || "restart/config";
      meta = JSON.stringify(evt.payload?.payload?.stats || evt.payload?.stats || {});
    } else if (kind === "link") {
      text = evt.linked ? "Link channel connected" : "Link channel disconnected";
    } else if (kind === "session") {
      const s = evt.session || {};
      text = `Session updated: ${s.key || "?"}`;
      meta = `model=${s.model || "?"} tokens=${s.totalTokens ?? "?"}`;
    } else {
      text = JSON.stringify(evt).slice(0, 180);
    }

    const ts = (initial && evt.ts) ? evt.ts : (Date.now()/1000);
    addFeed(kind, text, meta, ts);
  }

  function addFeed(kind, text, meta, ts) {
    const el = document.createElement('div');
    el.className = 'feed-item';
    el.innerHTML = `
      <div class="t">${fmtTime(ts)} • ${kind}</div>
      <div>${text}</div>
      <div class="k mono">${meta || ''}</div>
    `;
    feed.prepend(el);
  }

  async function boot() {
    const s = await fetch('/api/status').then(r=>r.json());
    renderStatus(s);

    const a = await fetch('/api/activity').then(r=>r.json());
    (a.events || []).forEach(evt => renderEvent(evt, true));

    const es = new EventSource('/api/events');
    es.addEventListener('link', (e) => {
      const d = JSON.parse(e.data);
      renderEvent(d);
      refresh();
    });
    es.addEventListener('cron_run', (e) => {
      const d = JSON.parse(e.data);
      const txt = `${d.jobName || d.jobId} → ${d.status || 'unknown'}`;
      renderEvent(d);
      refresh();
    });
    
    es.addEventListener('restart', (e) => {
      const d = JSON.parse(e.data);
      const msg = d.payload?.message || 'Restart/config apply';
      renderEvent(d);
      refresh();
    });
  }

  async function refresh() {
    const s = await fetch('/api/status').then(r=>r.json());
    renderStatus(s);

    const a = await fetch('/api/activity').then(r=>r.json());
    (a.events || []).forEach(evt => renderEvent(evt, true));
  }

  function renderStatus(s) {
    if (s.openclaw_ok) {
      oc.innerHTML = `<span class="pill ok">OK</span>`;
      const link = s.openclaw_status?.linkChannel;
      const linked = (link && link.linked !== undefined) ? link.linked : null;
      const linkedTxt = linked === null ? '' : (linked ? 'linked' : 'unlinked');
      ocmeta.textContent = `sessions=${s.openclaw_status?.sessions?.count ?? '?'} • ${linkedTxt}`;
    } else {
      oc.innerHTML = `<span class="pill bad">ERR</span>`;
      ocmeta.textContent = s.openclaw_error || 'openclaw status failed';
    }

    if (s.cron_enabled === null || s.cron_enabled === undefined) {
      cronmeta.textContent = '';
    } else {
      cronmeta.textContent = `cron: ${s.cron_enabled ? 'on' : 'off'} • jobs=${s.cron_jobs ?? '?'} • nextWakeAtMs=${s.cron_next_wake_at_ms ?? '?'}`;
    }

    if (s.last_restart && s.last_restart.payload) {
      restartMsg.textContent = s.last_restart.payload.message || '(no message)';
      restartMeta.textContent = JSON.stringify(s.last_restart.payload.stats || {});
    } else {
      restartMsg.textContent = '—';
      restartMeta.textContent = '—';
    }
  }

  setInterval(()=>{
    document.getElementById('clock').textContent = new Date().toLocaleString();
  }, 1000);

  boot();
</script>
</body>
</html>
